<div class="profile-container max-w-lg mx-auto p-6 bg-white shadow-lg rounded-lg mt-8">
  <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Mon Profil</h2>
  <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="space-y-6">
    <mat-form-field class="w-full">
      <input
        matInput
        placeholder="Nom d'utilisateur"
        formControlName="username"
        class="w-full px-4 py-2 text-gray-700 bg-gray-100 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </mat-form-field>
    <mat-form-field class="w-full">
      <input
        matInput
        placeholder="Email"
        formControlName="email"
        class="w-full px-4 py-2 text-gray-700 bg-gray-100 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </mat-form-field>
    <mat-form-field class="w-full">
      <input
        matInput
        placeholder="Téléphone"
        formControlName="phone"
        class="w-full px-4 py-2 text-gray-700 bg-gray-100 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </mat-form-field>
    <mat-form-field class="w-full">
      <mat-select
        placeholder="Rôle"
        formControlName="role"
        class="w-full px-4 py-2 text-gray-700 bg-gray-100 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
      >
        <mat-option *ngFor="let role of roles" [value]="role.value">
          {{ role.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>
    <button
      mat-raised-button
      color="primary"
      type="submit"
      [disabled]="profileForm.invalid"
      class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors"
    >
      Mettre à jour
    </button>
  </form>
</div>
